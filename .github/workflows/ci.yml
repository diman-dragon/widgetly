name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      dev_url:
        description: 'Live-reload: адрес dev-сервера, напр. http://192.168.1.50:8080 (пусто = обычная сборка)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEV_URL: ${{ github.event.inputs.dev_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (предустановлен на runner)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Веб - зависимости, типы, тесты, сборка
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Capacitor sync
        working-directory: web
        run: npx cap sync android

      - name: Сборка debug-APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Загрузка APK
        uses: actions/upload-artifact@v4
        with:
          name: widgetly-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Kotlin unit-тесты (не блокируют APK)
        working-directory: android
        continue-on-error: true
        run: ./gradlew --no-daemon testDebugUnitTest
